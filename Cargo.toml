[package]
name = "monitor-hub"
version = "1.5.2"
edition = "2021"
license = "MIT"
description = "Lightweight server monitoring hub"
repository = "https://github.com/monitor-probe/monitor"

[dependencies]
anyhow = "1"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "sync", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = { version = "0.8", features = ["ws", "macros"] }
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
argon2 = "0.5"
rand = "0.9"
sha2 = "0.11"
hex = "0.4"
futures-core = "0.3"
# Already built for rustls; verifies the agent binaries the hub relays.
ring = "0.17"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
rust-embed = { version = "8", features = ["include-exclude"] }
mime_guess = "2"
tokio-util = { version = "0.7", features = ["io"] }
tower-http = { version = "0.6", features = ["limit", "compression-gzip"] }
# The accept loop in `serve`: axum's own gives hyper no timer. All three are
# already built for axum with these features.
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
# Theme archives. Both are pure Rust: the release binary is built with `cross`
# and the image is FROM scratch, which rules out a C dependency or an external
# tar.
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# The open-file limit raised at startup, `TCP_USER_TIMEOUT` on accepted
# connections, and the opt-out of transparent huge pages. Pure Rust on Linux,
# so the cross-built musl binary gains no C dependency.
rustix = { version = "1", features = ["process", "net", "thread"] }

[dev-dependencies]
serde_urlencoded = "0.7"
# Only the tests need a movable clock; the relay deadline spans minutes.
# dev-dependencies do not reach the shipped binary.
tokio = { version = "1", features = ["test-util"] }

# On top of clippy's defaults, which CI runs with -D warnings. Tests may still
# unwrap (clippy.toml).
[lints.clippy]
# The release build aborts on panic, so a failed unwrap takes the whole hub
# down, and every node's reporting with it: use ?, or expect("why this cannot
# fail").
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[build-dependencies]
brotli = "9.1.3"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
